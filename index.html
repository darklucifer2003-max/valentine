<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',sans-serif;}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity 1s ease;z-index:-2;}
#bg2{opacity:0;}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.45);z-index:-1;}
.note{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:10px 18px;border-radius:20px;z-index:50;}
.page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:140px;color:#fff;text-align:center;}
#page2{background:#7a0019;justify-content:center;padding-bottom:0;}
h1{font-size:2.2rem;margin:0 20px 26px;}
.buttons{display:flex;gap:20px;transform:translateX(-40px);}
.btn{padding:14px 30px;border-radius:40px;font-size:17px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.yes{background:#2ecc71;}
.no{background:#e74c3c;position:fixed;z-index:40;}
</style>
</head>
<body>

<div id="bg1" class="bg"></div>
<div id="bg2" class="bg"></div>
<div class="overlay"></div>

<div class="note">🎵 Tap anywhere to play music</div>

<audio id="music" loop>
  <source src="assets/music.mpeg" type="audio/mpeg">
</audio>

<div class="page" id="page1">
  <h1>Hey Love, Will You Be My Valentine? 💞</h1>
  <div class="buttons">
    <button class="btn yes" id="yesBtn">Yes 🥰</button>
  </div>
</div>

<button class="btn no" id="noBtn">No 😢</button>

<div class="page" id="page2" style="display:none;">
  <h1>Thank you for being my Valentine ❤️</h1>
</div>

<script>
const images = ["assets/bg/bg1.jpg", "assets/bg/bg2.jpg", "assets/bg/bg3.jpg", "assets/bg/bg4.jpg", "assets/bg/bg5.jpg"];
let current = 0;
let showingFirst = true;

const bg1 = document.getElementById("bg1");
const bg2 = document.getElementById("bg2");
bg1.style.backgroundImage = `url(${images[0]})`;

const slideInterval = setInterval(() => {
  let next;
  do {
    next = Math.floor(Math.random() * images.length);
  } while (next === current);
  current = next;

  const show = showingFirst ? bg2 : bg1;
  const hide = showingFirst ? bg1 : bg2;

  show.style.backgroundImage = `url(${images[current]})`;
  show.style.opacity = 1;
  hide.style.opacity = 0;

  showingFirst = !showingFirst;
}, 2000);

const music = document.getElementById("music");
document.body.addEventListener("click", () => music.play().catch(()=>{}), {once:true});

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

function moveNo() {
  const pad = 20;
  noBtn.style.left = (Math.random() * (innerWidth - noBtn.offsetWidth - pad*2) + pad) + "px";
  noBtn.style.top  = (Math.random() * (innerHeight - noBtn.offsetHeight - pad*2) + pad) + "px";
}

setTimeout(() => {
  const r = yesBtn.getBoundingClientRect();
  noBtn.style.left = (r.right + 20) + "px";
  noBtn.style.top  = r.top + "px";
}, 100);

setInterval(moveNo, 1500);

yesBtn.onclick = () => {
  clearInterval(slideInterval);
  page1.style.display = "none";
  page2.style.display = "flex";
  noBtn.style.display = "none";
  bg1.style.opacity = 0;
  bg2.style.opacity = 0;
};
</script>

</body>
</html>
