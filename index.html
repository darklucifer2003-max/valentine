<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine</title>
<style>
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  font-family:'Segoe UI',sans-serif;
}
body{background:url('assets/bg.jpg') center/cover no-repeat;}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.45);}

.note{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.6);color:#fff;
  padding:10px 18px;border-radius:20px;z-index:50;
}

.page{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  flex-direction:column;
  padding-bottom:140px;
  color:white;
  text-align:center;
}

h1{
  font-size:2.2rem;
  margin-bottom:28px;
  z-index:10;
}

.buttons{
  display:flex;
  gap:26px;
  z-index:10;
  transform: translateX(-40px); /* MOVE BOTH BUTTONS LEFT */
}

.btn{
  padding:14px 30px;
  border-radius:40px;
  font-size:17px;
  border:none;
  cursor:pointer;
}

.yes{background:#2ecc71;}
.no{background:#e74c3c;position:fixed;z-index:40;}

/* FLOATING */
.emoji,.photo{position:fixed;pointer-events:none;}
.emoji{font-size:30px;opacity:0.8;animation:floatUp 6s linear forwards;}
.photo{
  width:95px;height:95px;border-radius:18px;
  object-fit:cover;
  animation:floatUp 8s linear forwards;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
.confetti{
  position:fixed;top:-20px;width:8px;height:8px;
  animation:fallDown 5s linear forwards;
  pointer-events:none;
}

@keyframes floatUp{
  from{transform:translateY(110vh);}
  to{transform:translateY(-20vh);opacity:0;}
}
@keyframes fallDown{
  from{transform:translateY(-10vh);}
  to{transform:translateY(120vh);opacity:0;}
}
</style>
</head>
<body>

<div class="overlay"></div>
<div class="note">🎵 Tap anywhere to play music</div>
<audio id="music" loop><source src="assets/music.mp4"></audio>

<div class="page" id="page1">
  <h1>Hey Love, Will You Be My Valentine? 💞</h1>
  <div class="buttons">
    <button class="btn yes" id="yesBtn">Yes 🥰</button>
  </div>
</div>

<button class="btn no" id="noBtn">No 😢</button>

<div class="page" id="page2" style="display:none;background:linear-gradient(135deg,#ff758c,#ff7eb3);">
  <h1>Thank you for being my Valentine ❤️</h1>
</div>

<script>
const music=document.getElementById("music");
document.body.addEventListener("click",()=>music.play().catch(()=>{}),{once:true});

const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");

const bw=noBtn.offsetWidth, bh=noBtn.offsetHeight;
noBtn.style.width=bw+"px"; noBtn.style.height=bh+"px";

function placeNo(){
  const yesRect = yesBtn.getBoundingClientRect();
  const offset = 30;
  noBtn.style.left = (yesRect.right + offset) + "px";
  noBtn.style.top  = yesRect.top + "px";
}

function overlapYes(){
  const a=noBtn.getBoundingClientRect();
  const b=yesBtn.getBoundingClientRect();
  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

function moveNo(){
  const pad=24; let tries=0;
  do{
    noBtn.style.left=(Math.random()*(window.innerWidth-bw-pad*2)+pad)+"px";
    noBtn.style.top=(Math.random()*(window.innerHeight-bh-pad*2)+pad)+"px";
    tries++;
  }while(overlapYes() && tries<100);
}

setTimeout(placeNo, 50);
noBtn.onclick=e=>{e.preventDefault();moveNo();};

// Emojis
setInterval(()=>{
  const e=document.createElement("div");
  e.className="emoji";
  e.innerText=["❤️","😍","🥰","😘"][Math.floor(Math.random()*4)];
  e.style.left=Math.random()*90+"vw";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),6000);
},500);

// Photos
const photos=['assets/photos/p1.jpg', 'assets/photos/p2.jpg', 'assets/photos/p3.jpg', 'assets/photos/p4.jpg', 'assets/photos/p5.jpg'];
setInterval(()=>{
  const img=document.createElement("img");
  img.src=photos[Math.floor(Math.random()*photos.length)];
  img.className="photo";
  img.style.left=(Math.random()<0.5?5+Math.random()*15:80+Math.random()*15)+"vw";
  document.body.appendChild(img);
  setTimeout(()=>img.remove(),8000);
},2600);

// Yes page
yesBtn.onclick=()=>{
  document.getElementById("page1").style.display="none";
  document.getElementById("page2").style.display="flex";
  noBtn.style.display="none";
  startConfetti();
};

function startConfetti(){
  setInterval(()=>{
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["#ff4d6d","#ffd166","#4cc9f0","#06d6a0","#c77dff"]
      [Math.floor(Math.random()*5)];
    const s=6+Math.random()*6;
    c.style.width=s+"px"; c.style.height=s+"px";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  },120);
}
</script>

</body>
</html>
